# Build multi-platform paycrest-mcp binaries and publish a GitHub Release.
#
# Ship a version:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Assets appear at: https://github.com/paycrest/sender-mcp/releases
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "→ ${out}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="-s -w" -o "dist/${out}" .
          }

          build windows amd64 "paycrest-mcp_${VERSION}_windows_amd64.exe"
          build darwin  amd64 "paycrest-mcp_${VERSION}_darwin_amd64"
          build darwin  arm64 "paycrest-mcp_${VERSION}_darwin_arm64"
          build linux   amd64 "paycrest-mcp_${VERSION}_linux_amd64"
          build linux   arm64 "paycrest-mcp_${VERSION}_linux_arm64"

          ( cd dist && sha256sum paycrest-mcp_* > checksums.txt )
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/paycrest-mcp_*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
